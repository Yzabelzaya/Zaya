  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a96e; --gold-light: #e8cfa0; --gold-dim: #7a6140;
      --bg: #080605; --surface: #110e0b;
      --border: rgba(201,169,110,0.15);
      --text: #f0e8dc; --text-muted: #9a8c7a;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Jost', sans-serif;
    }
    html { -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }
    .banner { position: relative; width: 100%; height: clamp(240px, 45vw, 460px); overflow: hidden; }
    .banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
    .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,6,5,0.1) 0%, transparent 35%, rgba(8,6,5,0.55) 70%, var(--bg) 100%); }
    .profile-section { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 1.5rem 2rem; margin-top: -2.5rem; position: relative; z-index: 2; }
    .avatar-ring { width: 100px; height: 100px; border-radius: 50%; padding: 2.5px; background: linear-gradient(135deg, var(--gold), #5a3d1a, var(--gold-light), #5a3d1a, var(--gold)); background-size: 300% 300%; animation: goldSpin 5s ease infinite; margin-bottom: 1.4rem; }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 300; color: var(--gold); }
    @keyframes goldSpin { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .name { font-family: var(--font-display); font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 300; letter-spacing: 0.08em; margin-bottom: 0.4rem; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: textGlow 4s ease infinite; }
    @keyframes textGlow { 0%,100% { background-position: 0%; } 50% { background-position: 100%; } }
    .handle { font-size: 0.75rem; font-weight: 300; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 1.1rem; }
    .tagline { font-family: var(--font-display); font-style: italic; font-size: clamp(1rem, 2.8vw, 1.25rem); color: var(--gold-light); opacity: 0.85; max-width: 26ch; line-height: 1.6; }
    .divider { display: flex; align-items: center; gap: 0.6rem; padding: 0 2.5rem; margin: 1.75rem 0; opacity: 0.35; }
    .divider-line { flex: 1; height: 1px; background: var(--gold-dim); }
    .divider-gem { width: 6px; height: 6px; border: 1px solid var(--gold); transform: rotate(45deg); }
    .links-section { padding: 0 1.25rem 5rem; max-width: 440px; margin: 0 auto; }
    .fanvue-btn { display: flex; align-items: center; justify-content: space-between; padding: 1.4rem 1.6rem; border-radius: 0.75rem; border: 1px solid rgba(201,169,110,0.45); background: linear-gradient(135deg, #1c1308 0%, #2e1f08 50%, #1c1308 100%); text-decoration: none; cursor: pointer; position: relative; overflow: hidden; transition: all 220ms cubic-bezier(0.16,1,0.3,1); }
    .fanvue-btn:hover { border-color: rgba(201,169,110,0.7); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .btn-left { display: flex; flex-direction: column; gap: 0.25rem; }
    .btn-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; letter-spacing: 0.1em; color: var(--gold-light); }
    .btn-sub { font-size: 0.7rem; font-weight: 300; color: var(--text-muted); letter-spacing: 0.14em; text-transform: uppercase; }
    .btn-arrow { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(201,169,110,0.3); background: rgba(201,169,110,0.07); flex-shrink: 0; }
    .btn-arrow svg { width: 15px; height: 15px; stroke: var(--gold); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    footer { text-align: center; padding: 1.5rem 1rem 3rem; font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.4; }
    .fade-up { opacity: 0; transform: translateY(16px); animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
    .d1{animation-delay:0.1s} .d2{animation-delay:0.22s} .d3{animation-delay:0.34s} .d4{animation-delay:0.46s} .d5{animation-delay:0.6s}
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
